<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OZ34HG // MULTIVERSE</title>
    <style>
        :root {
            --primary-glow: #ff0055;
            --secondary-glow: #00f2ff;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            /* Leopard print fallback pattern */
            background-image: radial-gradient(#4d2e13 20%, transparent 20%),
                              radial-gradient(#4d2e13 20%, transparent 20%);
            background-position: 0 0, 50px 50px;
            background-size: 100px 100px;
            font-family: 'Courier New', Courier, monospace;
            cursor: crosshair;
        }

        /* Sensory Overload Overlay */
        .noise {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media.giphy.com/media/oEI9uWUic9Zf2/giphy.gif');
            opacity: 0.05;
            pointer-events: none;
            z-index: 999;
        }

        /* Floating Stickers */
        .sticker {
            position: absolute;
            user-select: none;
            cursor: move;
            transition: transform 0.1s;
            filter: drop-shadow(5px 5px 0px #000);
        }

        .sticker:hover {
            transform: scale(1.2) rotate(10deg);
            z-index: 100;
        }

        /* GitHub Profile Image */
        #profile-pic {
            width: 150px;
            border: 5px solid #fff;
            outline: 5px solid var(--primary-glow);
            border-radius: 10px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1) rotate(-5deg); }
            50% { transform: scale(1.1) rotate(5deg); }
            100% { transform: scale(1) rotate(-5deg); }
        }

        /* Text Styles */
        .neon-text {
            color: #fff;
            text-shadow: 0 0 10px var(--primary-glow), 0 0 20px var(--primary-glow);
            font-size: 2rem;
            background: rgba(0,0,0,0.7);
            padding: 5px;
        }

        marquee {
            position: fixed;
            width: 100%;
            background: #ff0055;
            color: white;
            font-weight: bold;
            z-index: 1000;
        }

        .skill-card {
            background: #fff;
            border: 3px solid #000;
            padding: 10px;
            box-shadow: 10px 10px 0px #00f2ff;
        }

        #ui-layer {
            pointer-events: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
        }
    </style>
</head>
<body>

    <marquee scrollamount="20">SKILLS: C++ // JAVA // PYTHON // OVERLOAD DETECTED // 444 // ERROR: TOO COOL // SKILLS: C++ // JAVA // PYTHON</marquee>

    <div class="noise"></div>

    <div class="sticker" style="top: 15%; left: 10%;">
        <a href="https://github.com/oz34hg" target="_blank">
            <img id="profile-pic" src="https://github.com/oz34hg.png" alt="oz34hg profile">
            <div class="neon-text" style="text-align:center;">OZ34HG</div>
        </a>
    </div>

    <div class="sticker skill-card" style="top: 50%; left: 40%; transform: rotate(-10deg);">
        <h2>C++</h2>
        <p>Memory Management & Chaos</p>
    </div>

    <div class="sticker skill-card" style="top: 20%; right: 15%; transform: rotate(15deg);">
        <h2>JAVA</h2>
        <p>Object-Oriented Madness</p>
    </div>

    <div class="sticker skill-card" style="top: 70%; left: 15%; transform: rotate(5deg);">
        <h2>PYTHON</h2>
        <p>Sleek. Fast. Lethal.</p>
    </div>

    <div class="sticker neon-text" style="top: 40%; right: 10%;">LIPSTICK & LOGIC</div>
    <div class="sticker" style="bottom: 10%; right: 10%; font-size: 5rem;">🎸</div>
    <div class="sticker" style="top: 5%; right: 40%; font-size: 4rem;">✨</div>
    <div class="sticker" style="bottom: 40%; left: 5%; font-size: 6rem; color: red;">777</div>

    <script>
        // Make stickers draggable
        const stickers = document.querySelectorAll('.sticker');
        
        stickers.forEach(sticker => {
            let isDragging = false;
            let offset = { x: 0, y: 0 };

            sticker.addEventListener('mousedown', (e) => {
                isDragging = true;
                offset.x = e.clientX - sticker.offsetLeft;
                offset.y = e.clientY - sticker.offsetTop;
                sticker.style.zIndex = 1000;
            });

            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    sticker.style.left = (e.clientX - offset.x) + 'px';
                    sticker.style.top = (e.clientY - offset.y) + 'px';
                }
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });
        });

        // Sensory Sparkle Effect on Click
        document.addEventListener('click', (e) => {
            const sparkle = document.createElement('div');
            sparkle.innerHTML = 'XOXO';
            sparkle.style.position = 'fixed';
            sparkle.style.left = e.clientX + 'px';
            sparkle.style.top = e.clientY + 'px';
            sparkle.style.color = '#ff0055';
            sparkle.style.fontWeight = 'bold';
            sparkle.style.pointerEvents = 'none';
            sparkle.style.zIndex = 10000;
            document.body.appendChild(sparkle);

            setTimeout(() => sparkle.remove(), 1000);
        });
    </script>
</body>
</html>
