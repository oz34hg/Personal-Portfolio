<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OZ34HG // DEVELOPER PORTFOLIO</title>
    <style>
        :root {
            --neon-pink: #ff0055;
            --neon-blue: #00f2ff;
            --gold: #d4af37;
        }

        * { cursor: url('https://cur.cursors-4u.net/symbols/sym-1/sym49.cur'), auto !important; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #1a0f00;
            /* Professional Texture: Leopard Print Tile */
            background-image: url('https://www.transparenttextures.com/patterns/leopard.png'), 
                              linear-gradient(45deg, #2b1b0a 25%, #4d2e13 100%);
            overflow: hidden;
            font-family: 'Impact', 'Arial Black', sans-serif;
            color: white;
        }

        /* Scanline / Grain Overlay for that Retro Feel */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none; z-index: 9999;
        }

        /* Draggable Element Styles */
        .layer {
            position: absolute;
            user-select: none;
            filter: drop-shadow(8px 8px 0px rgba(0,0,0,0.8));
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .layer:hover {
            transform: scale(1.05) rotate(2deg);
            z-index: 500 !important;
        }

        /* Profile Card */
        .profile-container {
            border: 8px solid #fff;
            background: #000;
            padding: 15px;
            text-align: center;
            box-shadow: 15px 15px 0px var(--neon-pink);
        }

        .profile-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border: 4px solid var(--neon-blue);
        }

        /* Skill Badges */
        .badge {
            background: #fff;
            color: #000;
            padding: 10px 20px;
            font-size: 1.5rem;
            border: 4px solid #000;
            display: inline-block;
            transform: skew(-10deg);
        }

        .c-plus { box-shadow: 8px 8px 0px #ff0000; }
        .java { box-shadow: 8px 8px 0px #f89820; }
        .python { box-shadow: 8px 8px 0px #3776ab; }

        /* Aesthetic Asset Placeholders */
        .aesthetic-img { width: 180px; pointer-events: none; }
        
        .ticker-wrap {
            position: fixed; bottom: 0; width: 100%;
            background: var(--neon-pink);
            color: white; padding: 10px 0;
            font-size: 2rem; white-space: nowrap;
            overflow: hidden; z-index: 1000;
        }

        .ticker { display: inline-block; animation: scroll 15s linear infinite; }

        @keyframes scroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 200px #000; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="overlay"></div>
    <div class="vignette"></div>

    <div class="ticker-wrap">
        <div class="ticker">
            444 ENTER THE VOID // C++ ARCHITECT // JAVA NINJA // PYTHON SCRIPTER // OZ34HG PORTFOLIO // 777 // ERROR 404: TOO MUCH STYLE
        </div>
    </div>

    <div class="layer profile-container" style="top: 10%; left: 5%;" id="profile">
        <a href="https://github.com/oz34hg" target="_blank">
            <img class="profile-img" src="https://github.com/oz34hg.png" alt="oz34hg">
            <h1 style="margin: 10px 0 0 0;">@OZ34HG</h1>
        </a>
    </div>

    <img src="https://images.unsplash.com/photo-1594145075535-3914a47833a6?q=80&w=200&auto=format&fit=crop" 
         class="layer aesthetic-img" style="top: 40%; right: 10%; transform: rotate(15deg);" alt="Aesthetic Lips">

    <img src="https://images.unsplash.com/photo-1550985543-49830829873d?q=80&w=200&auto=format&fit=crop" 
         class="layer aesthetic-img" style="top: 5%; right: 25%; transform: rotate(-10deg);" alt="Guitar">

    <div class="layer badge c-plus" style="top: 45%; left: 35%;">EXPERIENCE::C++</div>
    <div class="layer badge java" style="top: 15%; right: 40%;">EXPERIENCE::JAVA</div>
    <div class="layer badge python" style="top: 70%; left: 20%;">EXPERIENCE::PYTHON</div>

    <div class="layer" style="top: 60%; right: 5%; font-size: 8rem; color: var(--gold);">777</div>
    <div class="layer" style="top: 80%; right: 30%; font-size: 5rem;">✨</div>
    <div class="layer" style="top: 30%; left: 45%; font-size: 4rem; color: #ff0055;">XOXO</div>

    <script>
        // Professional Drag-and-Drop implementation
        const layers = document.querySelectorAll('.layer');
        let activeLayer = null;
        let currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;

        layers.forEach(layer => {
            layer.addEventListener('mousedown', dragStart);
        });

        document.addEventListener('mouseup', dragEnd);
        document.addEventListener('mousemove', drag);

        function dragStart(e) {
            activeLayer = e.currentTarget;
            initialX = e.clientX - (activeLayer.offsetLeft);
            initialY = e.clientY - (activeLayer.offsetTop);
        }

        function dragEnd() {
            activeLayer = null;
        }

        function drag(e) {
            if (activeLayer) {
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                activeLayer.style.left = currentX + "px";
                activeLayer.style.top = currentY + "px";
            }
        }

        // Add "Glitch" sound effect or visual flare on click
        document.body.addEventListener('mousedown', () => {
            document.body.style.filter = "invert(1) hue-rotate(180deg)";
            setTimeout(() => document.body.style.filter = "none", 50);
        });
    </script>
</body>
</html>
