<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Links</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    color:white;

    background-image:url("https://raw.githubusercontent.com/oz34hg/Personal-Portfolio/main/IMG_5960.jpeg");
    background-repeat:repeat;
    background-size:200px;
}

.container{
    min-height:100vh;
    padding:30px;
    background:rgba(0,0,0,0.85);
}

input{
    width:100%;
    padding:15px;
    margin-bottom:25px;
    background:#111;
    border:1px solid #444;
    color:white;
    font-size:18px;
    border-radius:8px;
}

.links{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
    gap:15px;
}

.link{
    padding:15px;
    background:#151515;
    border:1px solid #333;
    border-radius:8px;
}

.link:hover{
    border-color:#00ff99;
}

a{
    color:#00ff99;
    text-decoration:none;
    word-break:break-all;
}

</style>

</head>

<body>

<div class="container">

<input 
id="search"
placeholder="Search links..."
>

<div class="links" id="links"></div>

</div>


<script>

const links = [

["facebook", "https://www.facebookwkhpilnemxj7asaniu7vnjjbiltxjqhye3mhbshg7kx5tfyd.onion"],
["Ahmia.fi", "http://juhanurmihx|p77nkq76byazcldy2hlmovfu2epv|5ankdibsot4csyd.onion"],
["haystak search engine", "http://haystak5njsmn2hqkewecpaxetahtwhsbsa64jom2k22z5afxhnpxfid.onion"],
["CIA", "http://ciadotgov4sjwlzihbbgxnqg3xiyrg7s02r2o3lt5wz5ypk4sxyjstad.onion/index.html"],
];


const box=document.getElementById("links");


function load(filter=""){

box.innerHTML="";

links
.filter(x =>
x[0].toLowerCase().includes(filter.toLowerCase()) ||
x[1].toLowerCase().includes(filter.toLowerCase())
)
.forEach(x=>{

box.innerHTML += `
<div class="link">
<a href="${x[1]}" target="_blank">
${x[0]}<br>
${x[1]}
</a>
</div>
`;

});

}


load();


document.getElementById("search")
.addEventListener("input",e=>{
load(e.target.value);
});


</script>

</body>
</html>
